name: swaraksha
description: "Swaraksha - Real-Time On-Device AI Voice Deepfake Detection VoIP Calling App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1

  # On-Device Machine Learning Inference
  tflite_flutter: ^0.10.4

  # Real-Time VoIP & WebRTC Audio Engine
  livekit_client: ^2.1.4
  flutter_webrtc: ^1.6.0

  # System Permissions & Storage
  permission_handler: ^11.3.1
  path_provider: ^2.1.3

  # UI, Icons & Haptics
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/bara_denoising_cae.tflite
    - assets/gammatone_filterbank.bin
    - assets/bara_config.json
